<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loose leaf paper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desk">
        <div class="controls" role="radiogroup" aria-label="用紙スタイル">
            <label><input type="radio" name="skin" value="classic"> クラシック</label>
            <label><input type="radio" name="skin" value="real" checked> リアル</label>
            <label><input type="radio" name="skin" value="view"> 表示</label>
        </div>

        <div class="sheet">
            <div class="holes" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="sheet-head">
                <div class="hrow">
                    <span class="field">
                        <span class="label">No.</span>
                        <span class="value" contenteditable="true" spellcheck="false" role="textbox" aria-label="No.">1</span>
                    </span>
                    <span class="field">
                        <span class="label">Date.</span>
                        <span class="value" contenteditable="true" spellcheck="false" role="textbox" aria-label="Date">YYYY年MM月DD日</span>
                    </span>
                </div>
                <div class="hrow title">
                    <span class="field">
                        <span class="label">Title</span>
                        <span class="value grow" contenteditable="true" spellcheck="false" role="textbox" aria-label="Title" data-ph="タイトルを入力"></span>
                    </span>
                </div>
            </div>

            <div
                class="writing-area"
                contenteditable="true"
                spellcheck="false"
                role="textbox"
                aria-multiline="true"
                aria-label="ルーズリーフ 記入欄"
                data-placeholder="ここに自由に書き込めます…"
            ></div>

            <div class="sheet-foot" aria-hidden="true">LOOSE LEAF&nbsp;&nbsp;/&nbsp;&nbsp;A4&nbsp;&nbsp;/&nbsp;&nbsp;30 HOLES</div>
        </div>
    </div>

    <script>
        // 「表示」= リアルの見た目のまま、入力不可でサンプル文を表示するモード
        (function () {
            // サンプル画像（光合成の模式図）: img/figure.svg。float:left で本文が右へ回り込む。
            var SAMPLE_IMG =
                '<img class="sample-img" alt="サンプル画像（光合成の模式図）" src="img/figure.svg">';

            // ダミー画像（PNG）: img/dummy.png。float:right で本文は左へ回り込む。
            var PNG_URI = 'img/dummy.png';
            var SAMPLE_IMG2 =
                '<img class="sample-img sample-img--right" alt="ダミー画像（PNG）" src="' + PNG_URI + '">';
            // 左に float（本文は右へ回り込む）
            var SAMPLE_IMG_LEFT =
                '<img class="sample-img" alt="ダミー画像（PNG）" src="' + PNG_URI + '">';
            // 左に配置するが float なし（割り込みなし＝本文は画像の下から）
            var SAMPLE_IMG_BLOCK =
                '<img class="sample-img sample-img--block" alt="ダミー画像（PNG）" src="' + PNG_URI + '">';

            var SAMPLE = {
                'No.':   '12',
                'Date':  '2026年8月30日',
                'Title': '光合成のしくみ ― 環境要因と反応速度のまとめ',
                'body':
                    SAMPLE_IMG +
                    '<p>光合成は、光エネルギーを使って二酸化炭素と水から有機物（グルコース）と' +
                    '酸素をつくる反応。左の図のように、光・水・二酸化炭素の3つがそろって初めて' +
                    '進行する。葉の内部では葉緑体のチラコイドで光を受け取り、ストロマで炭素を' +
                    '固定してデンプンをつくる。</p>' +
                    '<ul>' +
                    '<li>光の強さ … ある点までは強いほど速い（光飽和点）</li>' +
                    '<li>二酸化炭素濃度 … 濃いほど速いが頭打ちになる</li>' +
                    '<li>温度 … 酵素反応なので最適温度がある（約30〜35℃）</li>' +
                    '</ul>' +
                    SAMPLE_IMG2 +
                    '<p>【考察1・右に画像／割り込みあり】右のダミー画像（PNG）は本文の途中に' +
                    '差し込んだもの。float: right なので、テキストは画像の左側へ回り込む。' +
                    '画像の高さを罫線の整数倍にしておくと、回り込みが終わった後の行も' +
                    'そのまま罫線に乗る。</p>' +
                    SAMPLE_IMG_LEFT +
                    '<p>【考察2・左に画像／割り込みあり】これは float: left のパターン。' +
                    'ダミー画像が左に浮き、本文は画像の右側へ回り込む。文章が画像より' +
                    '長ければ、下端で全幅に戻って続きが流れる。ノートに写真を貼って' +
                    'その横に説明を書くときの典型的なレイアウト。</p>' +
                    SAMPLE_IMG_BLOCK +
                    '<p>【考察3・左に画像／割り込みなし】画像を block 表示（float なし）に' +
                    'したパターン。テキストは横に回り込まず、必ず画像の下から始まる。' +
                    '図を大きく見せたいときや、キャプションを画像の直下に置きたいときに使う。</p>' +
                    '<p>反応の速さは「最も不足している条件（限定要因）」で決まる。</p>'
            };

            var body = document.querySelector('.writing-area');
            var values = Array.prototype.slice.call(
                document.querySelectorAll('.sheet-head .value')
            );
            var editables = [body].concat(values);
            var saved = null;

            function currentSkin() {
                var r = document.querySelector('input[name="skin"]:checked');
                return r ? r.value : 'real';
            }

            function apply() {
                var view = currentSkin() === 'view';

                if (view && saved === null) {
                    saved = { body: body.innerHTML, values: values.map(function (el) {
                        return el.textContent;
                    }) };
                    body.innerHTML = SAMPLE.body;
                    values.forEach(function (el) {
                        var key = el.getAttribute('aria-label');
                        if (SAMPLE[key] != null) el.textContent = SAMPLE[key];
                    });
                } else if (!view && saved !== null) {
                    body.innerHTML = saved.body;
                    values.forEach(function (el, i) { el.textContent = saved.values[i]; });
                    saved = null;
                }

                editables.forEach(function (el) {
                    el.setAttribute('contenteditable', view ? 'false' : 'true');
                });
            }

            document.querySelectorAll('input[name="skin"]').forEach(function (r) {
                r.addEventListener('change', apply);
            });
            apply();
        })();
    </script>
</body>
</html>
